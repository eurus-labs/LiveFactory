[project]
name = "livefactory"
version = "0.1.0"
description = "A self-improving software factory with a deterministic core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.400",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livefactory"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
